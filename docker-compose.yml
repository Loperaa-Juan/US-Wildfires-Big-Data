# The whole system starts with one command:
#
#   docker compose up --build
#
# It runs in two stages, one after the other (MongoDB stays up through both):
#
#   1. Dask:  the Dask cluster starts and the `etl` service runs the ingestion pipeline on it
#             (download → transform → clean → load into MongoDB). When it succeeds, `etl` stops
#             the Dask scheduler and workers and exits.
#   2. Spark: only then the Spark master and workers start, and the `spark` service runs the
#             aggregations on them, saves them in MongoDB and exits.
#
# If the Dask stage fails, the Spark stage does not start.

# Shared settings of every container that runs project code (Dask cluster and ETL).
# They all see the dataset at the same path (/app/data) and reach MongoDB by its service name.
x-project: &project
  build:
    context: .
    dockerfile: docker/dask.Dockerfile
  image: us-wildfires-big-data
  # Run as the host user so the files written to ./data are not owned by root
  user: "${UID:-1000}:${GID:-1000}"
  environment: &project-env
    HOME: /tmp
    DATA_DIR: /app/data
    MONGO_URI: mongodb://mongo:27017
    DASK_SCHEDULER: tcp://dask-scheduler:8786
  volumes:
    - ./data:/app/data

# Shared settings of the Spark master, the workers and the driver: one image, so they all run
# the same Spark, Python and project code (executors run the driver's Python functions).
x-spark: &spark
  build:
    context: .
    dockerfile: docker/spark.Dockerfile
  image: us-wildfires-big-data-spark

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Stage 2 (Spark). The master waits until every Dask stage container has exited: the ETL
  # and also the scheduler and workers, which need a few seconds to shut down after the ETL
  # stops them. The workers and the driver wait for the master, so no Spark container runs
  # at the same time as the Dask stage.
  spark-master:
    <<: *spark
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports:
      - "8080:8080" # master UI (workers and running applications): http://localhost:8080
    depends_on:
      etl:
        condition: service_completed_successfully
      dask-scheduler:
        condition: service_completed_successfully
      dask-worker:
        condition: service_completed_successfully

  spark-worker:
    <<: *spark
    command: spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      # Resources each worker offers to the executors; change them in .env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-3g}
    deploy:
      replicas: ${SPARK_WORKERS:-2}
    depends_on:
      - spark-master

  # Spark driver: reads the fires from MongoDB, runs the aggregations on the cluster, saves
  # them in new collections and exits.
  # Run it again with: docker compose run --rm spark
  spark:
    <<: *spark
    command: python -m us_wildfires_big_data.spark.analysis
    restart: "no"
    environment:
      MONGO_URI: mongodb://mongo:27017
      SPARK_MASTER: spark://spark-master:7077
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-2g}
    ports:
      - "4040:4040" # application UI (jobs, stages, executors) while it runs
    depends_on:
      mongo:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started

  dask-scheduler:
    <<: *project
    command: dask scheduler
    ports:
      - "8786:8786" # scheduler
      - "8787:8787" # dashboard: http://localhost:8787

  dask-worker:
    <<: *project
    # Two worker containers that together run one single-threaded worker per logical processor
    # of the machine (nproc / 2 each). DASK_NWORKERS overrides the number per container.
    command: >-
      sh -c 'exec dask worker tcp://dask-scheduler:8786 --nthreads 1
      --nworkers "$${DASK_NWORKERS:-$$(( $$(nproc) / 2 > 0 ?$$(nproc) / 2 : 1 ))}"'
    deploy:
      replicas: 2
    depends_on:
      dask-scheduler:
        condition: service_started
      mongo:
        condition: service_healthy

  # Stage 1 (Dask). Runs the full pipeline once, stops the Dask cluster and exits. Steps whose
  # output already exists are skipped. A single step can also be run by hand; as the cluster
  # is stopped at the end of the pipeline, start it first:
  #   docker compose up -d dask-scheduler dask-worker
  #   docker compose run --rm etl python -m us_wildfires_big_data.etl.clean
  etl:
    <<: *project
    command: python -m us_wildfires_big_data.etl.pipeline
    restart: "no"
    environment:
      <<: *project-env
      # Read from the shell or from a local .env file (never committed)
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      dask-worker:
        condition: service_started

volumes:
  mongo-data:
  