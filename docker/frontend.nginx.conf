server {
    listen 80;
    root /usr/share/nginx/html;

    # The grid of Spark cells is ~1.3 MB of JSON; compressed it is a fraction of that
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # /api/stats/grid -> http://api:5000/stats/grid (the trailing slash drops the /api prefix)
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Vite puts a content hash in every asset name, so they can be cached for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
